# Rebuild data/awards.json from Wikipedia and Wikidata once a year
# (Oct 1, after the January Golden Globes, March Oscars and September Emmys).
# Run it any time from the Actions tab with "Run workflow".
name: Update award data

on:
  schedule:
    - cron: "17 9 1 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: award-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build award data
        run: node scripts/build-awards.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/awards.json data/awards.csv)" ]; then
            echo "Award data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/awards.json data/awards.csv
          git commit -m "Update award winner data ($(date -u +%Y-%m-%d))"
          git push
